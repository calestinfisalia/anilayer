name: Bug report
description: Report unexpected behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Please search existing issues before submitting a report."
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include any error messages.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open AniLayer...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AniLayer and Windows versions
      placeholder: "AniLayer 1.0.0, Windows 11"
    validations:
      required: true
