name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows portable app
        run: npm run build
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: anilayer-windows-portable
          path: dist/*.exe
          if-no-files-found: error
